apiVersion: apps/v1
kind: Deployment
metadata:
  name: swe-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: swe-demo }
  template:
    metadata:
      labels: { app: swe-demo }
    spec:
      containers:
        - name: web
          image: tranminhhai/swe4006-minikube-demo:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: swe-demo
spec:
  selector: { app: swe-demo }
  ports:
    - port: 80
      targetPort: 80
